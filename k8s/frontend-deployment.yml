kind: Deployment
apiVersion: apps/v1
metadata:
  name: devboard-frontend-deployment
  namespace: devboard
  labels:
    app: devboard-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devboard-frontend
  template:
    metadata:
      labels:
        app: devboard-frontend
    spec:
      containers:
      - name: devboard-frontend
        image: rdn51015/devboard-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4173
        resources:
          requests:
            cpu: "10m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"